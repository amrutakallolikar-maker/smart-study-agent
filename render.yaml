services:
  # -- Backend: Node.js API --------------------------------------------------
  - type: web
    name: smart-study-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: GRANITE_TEXT_MODEL
        value: ibm/granite-13b-instruct-v2
      - key: WATSONX_API_KEY
        value: ""
      - key: WATSONX_PROJECT_ID
        value: ""
      - key: FRONTEND_URL
        value: ""

  # -- Frontend: React/Vite static site -------------------------------------
  - type: web
    name: smart-study-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
